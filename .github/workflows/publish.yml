name: Publish BookCraft APK
on:
  push:
    branches: [main]
    paths: ['channel/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bookcraft-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/bookcraft-android"
          mkdir -p "$sdk"
          curl --fail --location --silent --show-error --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$sdk/build.zip"
          printf '%s  %s\n' bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88 "$sdk/build.zip" | sha256sum --check
          unzip -q "$sdk/build.zip" -d "$sdk"
          printf 'BOOKCRAFT_ANDROID_TOOLS=%s\n' "$sdk/android-15" >> "$GITHUB_ENV"
      - name: Check package and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat channel/version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          apk="BookCraft-$version.apk"
          tools="$BOOKCRAFT_ANDROID_TOOLS"
          (cd channel && sha256sum --check "$apk.sha256")
          expected="$(cat release-signing-cert.sha256)"
          actual="$("$tools/apksigner" verify --print-certs "channel/$apk" | awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF}')"
          test "$actual" = "$expected"
          package="$("$tools/aapt2" dump badging "channel/$apk" | sed -n '1p')"
          [[ "$package" == *"name='my.bookcraft.studio'"* && "$package" == *"versionName='$version'"* ]]
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "BookCraft $version" --notes-file channel/notes.md --latest "channel/$apk" "channel/$apk.sha256"
